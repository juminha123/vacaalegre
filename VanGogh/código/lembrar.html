<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #solid{
        border-width: 2px;
        border-style: solid;
        border-color: blueviolet;
        margin: 10px;
        padding: 20px;
    }
    #dashed{
        border: 2px dashed blue;
        margin: 10px;
        padding: 20px;
    }
    #dotted{
        border: 5px dotted rgb(153, 60, 60);
        margin: 10px;
        padding: 20px;
    }
    #double{
        border: 7px double rgb(250, 103, 128);
        margin: 10px;
        padding: 20px;
    }
    #groove{
        border: 15px groove purple;
        margin: 10px;
        padding: 20px;
    }
    #rounded{
        border: 2px solid orange;
        margin: 10px;
        padding: 20px;
        border-radius: 40px;
    }    
    #top{
        border-top: 2px solid rgb(77, 0, 128);
    }
    #right{
        border-right: 2px solid rgb(45, 142, 162);
    }
     #bottom{
        border-bottom: 2px solid rgb(113, 62, 62);
    }
    #left{
        border-left: 2px solid rgb(18, 15, 154);
    }
</style>
<body>
    <div id="solid">borda sólida</div>
    <div id="dashed">borda tracejada</div>
    <div id="dotted">borda pontilhada</div>
    <div id="double">borda dupla</div>
    <div id="groove">borda sulco</div>
    <div id="rounded">borda arredondada</div>

    <div id="top">top</div><br>
    <div id="right">direita</div><br>
    <div id="bottom">baixo</div><br>
    <div id="left">esquerda</div>
</body>
</html>
